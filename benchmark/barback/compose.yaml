name: hypermeow-benchmark

services:
  cert-init:
    image: busybox:1.37.0
    command: ["chown", "-R", "65532:65532", "/certs"]
    volumes:
      - barback-certs:/certs
    cpus: 0.05
    mem_limit: 32m
    pids_limit: 16

  postgres:
    image: postgres:17.6-bookworm
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=32
      - -c
      - synchronous_commit=on
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: hypermeow
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hypermeow"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-stats.sql:ro
    cpus: 0.50
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 128

  barback:
    build:
      context: ${BARBACK_CONTEXT:-../../../Titan/devcenter}
      dockerfile: apps/barback/Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --cert-dir
      - /certs
      - --pairing-delay
      - "0"
      - --bench
      - --bench-rate
      - ${BENCH_RATE:-50}
      - --bench-total
      - ${BENCH_TOTAL:-200}
      - --bench-senders
      - ${BENCH_SENDERS:-1}
      - --bench-warmup-ms
      - ${BENCH_WARMUP_MS:-3000}
      - --bench-group
      - --bench-group-size
      - ${BENCH_GROUP_SIZE:-128}
      - --history-sync-conversations
      - ${HISTORY_CONVERSATIONS:-100}
      - --history-sync-messages
      - ${HISTORY_MESSAGES:-20}
      - --capture-messages
      - ${BARBACK_CAPTURE_MESSAGES:-0}
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      MEDIA_CONN_HOST: barback:8080
      RUST_LOG: ${BARBACK_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/usr/local/bin/barback", "--healthcheck", "--port", "8080"]
      interval: 1s
      timeout: 3s
      retries: 60
    cpus: 0.50
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    volumes:
      - barback-certs:/certs

  client:
    build:
      context: ../..
      dockerfile: benchmark/barback/Dockerfile
      additional_contexts:
        library: ${LIBRARY_CONTEXT:-../..}
      args:
        BENCH_BUILD_TAGS: ${BENCH_BUILD_TAGS:-}
        BUILD_REV: ${BUILD_REV:-working-tree}
    depends_on:
      barback:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BARBACK_TLS_CA: /certs/cert.pem
      BARBACK_TLS_SERVER_NAME: 0.0.0.0
      BARBACK_URL: https://barback:8080
      BARBACK_WS: wss://barback:8080/ws/chat
      BENCH_TIMEOUT: ${BENCH_TIMEOUT:-5m}
      BENCH_TOTAL: ${BENCH_TOTAL:-200}
      BENCH_VARIANT: ${BENCH_VARIANT:-candidate}
      BENCH_GROUP_SIZE: ${BENCH_GROUP_SIZE:-128}
      BENCH_BUSINESS_SMOKE: ${BENCH_BUSINESS_SMOKE:-false}
      BENCH_PHONE_CONSENT_SMOKE: ${BENCH_PHONE_CONSENT_SMOKE:-false}
      BENCH_MODE: ${BENCH_MODE:-group}
      BENCH_MESSAGE_PROFILE: ${BENCH_MESSAGE_PROFILE:-text}
      BENCH_RATE: ${BENCH_RATE:-50}
      BENCH_SCENARIO: ${BENCH_SCENARIO:-custom}
      BENCH_SENDERS: ${BENCH_SENDERS:-1}
      BENCH_WORKERS: ${BENCH_WORKERS:-1}
      BENCH_WARMUP_MS: ${BENCH_WARMUP_MS:-3000}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hypermeow?sslmode=disable
      HISTORY_CONVERSATIONS: ${HISTORY_CONVERSATIONS:-100}
      HISTORY_MESSAGES: ${HISTORY_MESSAGES:-20}
      MEM_PROFILE_PATH: ${MEM_PROFILE_PATH:-}
      RESULT_PATH: /results/${RESULT_FILE:-result.json}
    init: true
    volumes:
      - barback-certs:/certs:ro
      - ./results:/results
    cpus: 1.00
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 256

volumes:
  barback-certs:
  pgdata:
